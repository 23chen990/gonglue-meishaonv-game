name: Romance v4.17 native iOS Simulator Safari smoke

on:
  push:
    branches:
      - qa/romance-v417-ios-simulator-20261016
    paths:
      - '.github/workflows/romance-v417-ios-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      H5_ROOT: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4
      EXPECTED_STORY_SHA: 84842ca69a861849f16b20d72b4b45421675ea5a934cad51d5f7866e703acf93
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin exact canonical v4.17 story and verify the prebuilt H5
        shell: bash
        run: |
          set -euo pipefail
          echo "$EXPECTED_STORY_SHA  $H5_ROOT/data/STORY.json" | shasum -a 256 -c -
          grep -q "name=\"story-sha256\" content=\"$EXPECTED_STORY_SHA\"" "$H5_ROOT/index.html"
          grep -q "const STORY_HASH=\"$EXPECTED_STORY_SHA\"" "$H5_ROOT/index.html"
          xcodebuild -version
          xcrun simctl list devices available
      - name: Install project generator if absent
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
          xcodegen generate --spec qa/ios-simulator/project.yml
          xcodebuild -list -project qa/ios-simulator/RomanceNativeSimulator.xcodeproj
      - name: Start canonical H5 and boot a real iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-native-evidence"
          python3 -m http.server 8765 --bind 0.0.0.0 --directory "$H5_ROOT" \
            > "$RUNNER_TEMP/ios-native-evidence/http-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ios-native-evidence/http-server.pid"
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/index.html -o /dev/null
          python3 - <<'PY'
          import json, os, subprocess
          raw=subprocess.check_output(['xcrun','simctl','list','devices','available','--json'],text=True)
          devices=json.loads(raw)['devices']
          choices=[]
          for runtime,items in devices.items():
              if '.iOS-' not in runtime: continue
              for d in items:
                  if d.get('isAvailable') and d.get('name','').startswith('iPhone'):
                      choices.append((runtime, d['name'], d['udid']))
          assert choices, 'NO_IOS_SIMULATOR_RUNTIME_AVAILABLE'
          selected=next((d for d in reversed(choices) if 'Pro' in d[1]),choices[-1])
          print('Selected iOS simulator:', selected)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('IOS_SIMULATOR_UDID='+selected[2]+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Native iOS Simulator target: '+selected[0]+' / '+selected[1]+'\n\n')
          PY
      - name: Open actual Mobile Safari and capture full-resolution simulator pixels
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$IOS_SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
          xcrun simctl status_bar "$IOS_SIMULATOR_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl openurl "$IOS_SIMULATOR_UDID" "http://127.0.0.1:8765/index.html"
          sleep 10
          xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot "$RUNNER_TEMP/ios-native-evidence/safari-initial.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/ios-native-evidence/safari-initial.png"
      - name: Native iOS WKWebView and Safari XCUITest through touch accessibility
        shell: bash
        run: |
          set -euo pipefail
          set +e
          xcodebuild test \
            -project qa/ios-simulator/RomanceNativeSimulator.xcodeproj \
            -scheme RomanceNativeSmoke \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ios-native-evidence/romance-native.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/ios-native-evidence/xcodebuild.log" 2>&1
          result=$?
          set -e
          grep -E "IOS_QA|Test Case|Test Suite|TEST SUCCEEDED|TEST FAILED|error:|failed:" "$RUNNER_TEMP/ios-native-evidence/xcodebuild.log" | tail -n 160 || true
          if [ "$result" -ne 0 ]; then
            tail -n 110 "$RUNNER_TEMP/ios-native-evidence/xcodebuild.log"
            exit "$result"
          fi
      - name: Export XCUITest screenshots and native device report
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ios-native-evidence/attachments"
          if [ -d "$RUNNER_TEMP/ios-native-evidence/romance-native.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/ios-native-evidence/romance-native.xcresult" \
              --output-path "$RUNNER_TEMP/ios-native-evidence/attachments" || true
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/ios-native-evidence/romance-native.xcresult" --format json \
              > "$RUNNER_TEMP/ios-native-evidence/xcresult-summary.json" || true
          fi
          if [ -n "${IOS_SIMULATOR_UDID:-}" ]; then
            xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot "$RUNNER_TEMP/ios-native-evidence/final-simulator.png" || true
          fi
      - name: Archive actual simulator screenshots and native XCTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romance-v417-real-ios-simulator-evidence
          path: ${{ runner.temp }}/ios-native-evidence
          retention-days: 7
          if-no-files-found: warn
