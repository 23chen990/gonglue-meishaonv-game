name: UI candidate - reproducible story-safe generated artifacts

on:
  push:
    branches:
      - ui/romance-v412-cinematic-reader-20261015
    paths:
      - .github/workflows/romance-ui-generated.yml
      - runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/preview-ui.js
      - runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/vn.css
      - runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/preview.css
      - runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/build-preview.mjs
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: romance-ui-generated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize-generated:
    if: github.ref == 'refs/heads/ui/romance-v412-cinematic-reader-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/romance-v412-cinematic-reader-20261015
          persist-credentials: true
      - name: Reject changed branch HEAD and changed canonical story
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          root="runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4"
          actual="$(sha256sum "$root/data/STORY.json" | cut -d ' ' -f 1)"
          test "$actual" = "d473c470ade54b09c35b3bdaedcf4e0559c92f8c5ea96a3052d094fbc7dc10a3"
          git diff --exit-code HEAD -- "$root/data/STORY.json" "$root/tools/engine.mjs"
          echo "PROTECTED_STORY_SHA=$actual"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install root dependencies
        shell: bash
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Rebuild all canonical player outputs and run original source tests
        shell: bash
        run: |
          set -euo pipefail
          root="runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4"
          (cd "$root" && npm run verify)
          pnpm verify
          git diff --exit-code HEAD -- "$root/data/STORY.json" "$root/tools/engine.mjs"
      - name: Commit only story-safe generated player files to the UI branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          root="runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4"
          game="runs/20260831-010324-village-south-text-v1/workspace/game"
          git add -- "$root/play.html" "$root/index.html" "$root/runtime.mjs" "$root/repository-index.html" "$root/build-meta.json" "$game/index.html"
          if git diff --cached --quiet; then
            echo "All committed player outputs already current"
            exit 0
          fi
          echo "Generated artifacts being committed:"
          git diff --cached --name-only
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_sha="$(git ls-remote origin refs/heads/ui/romance-v412-cinematic-reader-20261015 | cut -f 1)"
          test "$remote_sha" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build(ui): synchronize offline and default reader from unchanged v4.12 story"
          git push origin HEAD:refs/heads/ui/romance-v412-cinematic-reader-20261015
          echo "GENERATED_HEAD=$(git rev-parse HEAD)"
      - name: Request new exact-HEAD CI acceptance after generated commit
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch='ui/romance-v412-cinematic-reader-20261015'
          head="$(git rev-parse HEAD)"
          printf 'Re-auditing generated candidate HEAD %s\n' "$head"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/romance-r41.yml/dispatches" \
            -d '{"ref":"ui/romance-v412-cinematic-reader-20261015"}'
