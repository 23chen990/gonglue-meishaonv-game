name: Romance interactive first-night controlled H5 generation
on:
  push:
    branches:
      - feat/interactive-first-night-20261016
    paths:
      - '.github/workflows/romance-interactive-first-night.yml'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/build-preview.mjs'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/interactive-opening.js'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/interactive-follow.js'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/interactive-opening.css'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/test-interactive-opening.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-first-night-20261016
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify branch, syntax and unmodified canonical story
        env:
          R4: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4
        run: |
          test "$(git branch --show-current)" = "feat/interactive-first-night-20261016"
          echo "84842ca69a861849f16b20d72b4b45421675ea5a934cad51d5f7866e703acf93  $R4/data/STORY.json" | sha256sum -c -
          node --check "$R4/tools/interactive-opening.js"
          python3 -m py_compile "$R4/tools/test-interactive-opening.py"
      - name: Rebuild and verify complete canonical engine and story
        working-directory: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4
        run: npm run verify
      - name: Preserve story and engine content
        env:
          R4: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4
        run: |
          echo "84842ca69a861849f16b20d72b4b45421675ea5a934cad51d5f7866e703acf93  $R4/data/STORY.json" | sha256sum -c -
          git diff --exit-code -- "$R4/data/STORY.json" "$R4/tools/engine.mjs"
      - name: Commit generated standalone and default H5
        env:
          R4: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4
          ENTRY: runs/20260831-010324-village-south-text-v1/workspace/game/index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$R4/play.html" "$R4/index.html" "$R4/runtime.mjs" "$R4/repository-index.html" "$R4/build-meta.json" "$ENTRY"
          git diff --cached --check
          if test -n "$(git diff --cached --name-only)"; then
            git commit -m "build: generate interactive first-night H5 and runtime"
            git push origin HEAD:refs/heads/feat/interactive-first-night-20261016
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: romance-interactive-first-night-h5
          path: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/play.html
          if-no-files-found: error
          retention-days: 14
