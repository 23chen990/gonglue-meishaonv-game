name: Romance first-night interactive cinema H5
on:
  push:
    branches: [feat/first-night-playable-unified-20261017]
    paths:
      - '.github/workflows/romance-first-night-unified.yml'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/tools/**'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/docs/**'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/assets/adv8/**'
      - 'runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4/art/**'
  workflow_dispatch:
concurrency:
  group: first-night-unified-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify-real-client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R4: runs/20260831-010324-village-south-text-v1/workspace/game/four-heroine-r4
      GAME: runs/20260831-010324-village-south-text-v1/workspace/game
      SOURCE_HASH: 84842ca69a861849f16b20d72b4b45421675ea5a934cad51d5f7866e703acf93
      R4_WEBKIT: '1'
      R4_REAL_URL: http://127.0.0.1:8765/index.html
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/first-night-playable-unified-20261017
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot source for independent UX and browser QA
        run: |
          tar -czf /tmp/romance-vn-source.tgz --exclude=.git --exclude=node_modules --exclude=dist --exclude=qa/current --exclude=play.html --exclude=runtime.mjs --exclude=index.html .
      - uses: actions/upload-artifact@v4
        with:
          name: romance-vn-source-snapshot
          path: /tmp/romance-vn-source.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve source and validate syntax
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/first-night-playable-unified-20261017"
          echo "$SOURCE_HASH  $R4/data/STORY.json" | sha256sum -c -
          for file in "$R4"/tools/romance-v*.js "$R4"/tools/*v*.mjs "$R4"/tools/interactive-*.js "$R4"/tools/mobile-reader.js "$R4"/tools/director-v6.js "$R4"/tools/build-preview.mjs; do
            node --check "$file"
          done
          python -m py_compile "$R4"/tools/test-romance-v*.py "$R4"/tools/test-interactive-opening.py
      - name: Rebuild full offline H5 and all canonical narrative tests
        working-directory: ${{ env.R4 }}
        run: npm run verify
      - name: Source-locked contracts and real replay fixtures
        working-directory: ${{ env.R4 }}
        run: |
          set -euo pipefail
          node tools/generate-romance-v11-fixtures.mjs
          node tools/generate-romance-v13-fixtures.mjs
          node tools/generate-romance-v23-fixtures.mjs
          for version in 10 11 13 15 16 17 18 19 20 21 22 23; do
            node "tools/test-romance-v${version}.mjs"
          done
          node tools/test-natural-dialogue-v12.mjs
          node tools/test-v14-orientation.mjs
          node tools/test-adv8-single-embedding.mjs
      - name: Default-entry lint, types and production build
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          corepack pnpm verify
      - name: Prepare Chromium and WebKit
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium webkit
      - name: Serve actual rebuilt player
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory "$R4" > /tmp/romance-first-night-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent "$R4_REAL_URL" -o /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$R4_REAL_URL" -o /dev/null
      - name: V23 default player - every reachable action and four full routes
        working-directory: ${{ env.R4 }}
        run: |
          python tools/test-romance-v23.py
          python tools/test-romance-v23-routes.py
      - name: Preserve all prior native touch regressions
        working-directory: ${{ env.R4 }}
        run: |
          set -euo pipefail
          python tools/test-romance-v21.py
          python tools/test-romance-v22.py
          python tools/test-interactive-opening.py
          for version in 9 10 11 13 15 16 17 17-contrast 18 19 20; do
            python "tools/test-romance-v${version}.py"
          done
      - name: Prove canonical story and engine unchanged
        run: |
          echo "$SOURCE_HASH  $R4/data/STORY.json" | sha256sum -c -
          git diff --exit-code -- "$R4/data/STORY.json" "$R4/tools/engine.mjs"
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: romance-first-night-unified-H5-and-browser-evidence
          path: |
            ${{ env.R4 }}/play.html
            ${{ env.R4 }}/qa/current/*report.json
            ${{ env.R4 }}/qa/current/browser/**
          if-no-files-found: warn
          retention-days: 14
      - name: Persist only validated generated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$R4/index.html" "$R4/play.html" "$R4/runtime.mjs" "$R4/repository-index.html" "$R4/build-meta.json" "$GAME/index.html"
          git diff --cached --check
          if test -n "$(git diff --cached --name-only)"; then
            git commit -m "build(vn): regenerate verified V23 chemistry and canonical H5"
            git fetch origin feat/first-night-playable-unified-20261017
            git rebase --autostash origin/feat/first-night-playable-unified-20261017
            git push origin HEAD:refs/heads/feat/first-night-playable-unified-20261017
          fi
